initial_start_date = "2026-01-01"   # change to limit initial load

[destination.filesystem]
gcp_project_number = "95715287188" # for Secret Manager
# Default bucket. Override per run with the GCS_BUCKET_URL env var (e.g. in a
# gitignored .env) to point at a personal test bucket — see .env.example.
bucket_url = "gs://aqueduct-poc-bravo-pvacd"
layout     = "{table_name}/year={YYYY}/month={MM}/day={DD}/{load_id}.{file_id}.{ext}"

[destination.frost]
# Default is the local `docker compose` FROST. Override with the
# FROST_SERVICE_ROOT_URL env var to point at a deployed server — see .env.example.
# A localhost URL is called unauthenticated; any other host gets a Google ID token.
service_root_url = "http://localhost:8081/FROST-Server"
